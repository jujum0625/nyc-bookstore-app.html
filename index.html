<script>
// ── SUPABASE ─────────────────────────────────────────────────────────────────
const _supabase = window.supabase.createClient(
  'https://txjngemvvpiqrrxhznzc.supabase.co',
  'sb_publishable_nweGjy0ATaDdZDAWeD5hWg_IGJZH7VR'
);

function getUserId() {
  let id = localStorage.getItem('nyc_bookstore_user_id');
  if (!id) {
    id = ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    localStorage.setItem('nyc_bookstore_user_id', id);
  }
  return id;
}

// Fix malformed price strings stored in DB (e.g. Luma dict repr)
function cleanPrice(raw) {
  if (!raw) return 'Free';
  // Detect Python dict repr: "{'cents': 1200, 'currency': 'usd', ...}"
  const centsMatch = String(raw).match(/'cents':\s*(\d+)/);
  if (centsMatch) {
    const dollars = parseInt(centsMatch[1], 10) / 100;
    return dollars === 0 ? 'Free' : `$${dollars % 1 === 0 ? dollars : dollars.toFixed(2)}`;
  }
  return raw;
}

// Returns today's date as YYYY-MM-DD in local time (no UTC shift)
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Format '2026-05-03' → 'May 3'
function fmtDate(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

async function loadEvents() {
  const { data, error } = await _supabase
    .from('events')
    .select('*')
    .gte('event_date', todayISO())
    .order('event_date', { ascending: true })
    .order('event_time', { ascending: true });
  if (error) { console.error('loadEvents:', error); return []; }
  return data.map(ev => ({
    ...ev,
    // Normalize id to string — Supabase returns BIGSERIAL as string in JS
    id:      String(ev.id),
    storeId: ev.venue_id,
    desc:    ev.description,
    date:    fmtDate(ev.event_date),
    // Clean up malformed price strings (e.g. Luma dict repr)
    price:   cleanPrice(ev.price),
    time:    ev.event_time,
  }));
}

async function fetchSaved() {
  const { data, error } = await _supabase
    .from('bookmarked_events').select('event_id').eq('user_id', getUserId());
  if (error) { console.error('fetchSaved:', error); return new Set(); }
  // Normalize to strings to match event.id comparison
  return new Set(data.map(r => String(r.event_id)));
}
async function saveEvent(id) {
  const { error } = await _supabase.from('bookmarked_events')
    .upsert({ user_id: getUserId(), event_id: String(id) }, { onConflict: 'user_id,event_id' });
  if (error) console.error('saveEvent:', error);
}
async function unsaveEvent(id) {
  const { error } = await _supabase.from('bookmarked_events')
    .delete().eq('user_id', getUserId()).eq('event_id', String(id));
  if (error) console.error('unsaveEvent:', error);
}
</script>

// Singleton SDK loader — resolves once the global google.maps is ready
let _gmapsPromise = null;
function loadGmapsSdk() {
  if (_gmapsPromise) return _gmapsPromise;
  _gmapsPromise = new Promise((resolve, reject) => {
    if (window.google && window.google.maps) { resolve(); return; }
    const cb = '__gmaps_cb_' + Date.now();
    window[cb] = () => { delete window[cb]; resolve(); };
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&loading=async&callback=${cb}`;
    s.async = true;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _gmapsPromise;
}

// Session-level cache: store.id → Place object (or null on failure)
const _placeCache = new Map();

async function fetchPlaceDetails(store) {
  if (_placeCache.has(store.id)) return _placeCache.get(store.id);
  try {
    await loadGmapsSdk();
    const { Place } = await window.google.maps.importLibrary('places');
    const textQuery = store.borough === 'Bronx' || store.borough === 'Brooklyn' || store.borough === 'Queens'
      ? `${store.name} ${store.address} ${store.borough} NY`
      : `${store.name} ${store.address} New York NY`;
    const { places } = await Place.searchByText({
      textQuery,
      fields: ['regularOpeningHours', 'rating', 'userRatingCount', 'nationalPhoneNumber', 'businessStatus'],
      locationBias: { lat: store.lat, lng: store.lng },
      maxResultCount: 1,
    });
    const place = places && places.length > 0 ? places[0] : null;
    _placeCache.set(store.id, place);
    return place;
  } catch (e) {
    console.warn('[places]', store.name, e.message);
    _placeCache.set(store.id, null);
    return null;
  }
}

function usePlaceDetails(store) {
  const [place, setPlace] = React.useState(undefined); // undefined=loading, null=not found/error
  React.useEffect(() => {
    if (!store) { setPlace(null); return; }
    setPlace(undefined); // show loading state
    fetchPlaceDetails(store).then(setPlace);
  }, [store && store.id]);
  return place;
}

function MapView({ t, themeKey, events, onSelectStore, selectedStore, active }) {
  const containerRef = useRef(null);
  const mapRef = useRef(null);        // google.maps.Map instance
  const markersRef = useRef([]);      // array of {marker, store, infoWindow}
  const [sdkReady, setSdkReady] = useState(false);
  const [sdkError, setSdkError] = useState(false);

  // Load SDK once
  useEffect(() => {
    loadGmapsSdk().then(() => setSdkReady(true)).catch(() => setSdkError(true));
  }, []);

  // Create map once SDK is ready and container is visible
  useEffect(() => {
    if (!sdkReady || !containerRef.current || mapRef.current) return;
    const styles = MAP_JS_STYLES[themeKey] || MAP_JS_STYLES.sage;
    mapRef.current = new window.google.maps.Map(containerRef.current, {
      center: { lat: 40.730, lng: -74.010 },
      zoom: 12,
      styles,
      disableDefaultUI: true,
      zoomControl: true,
      gestureHandling: 'greedy',
      zoomControlOptions: { position: window.google.maps.ControlPosition.RIGHT_CENTER },
    });

    // Add markers for every bookstore
    markersRef.current = BOOKSTORES.map(store => {
      const count = events.filter(e => e.storeId === store.id).length;
      const marker = new window.google.maps.Marker({
        position: { lat: store.lat, lng: store.lng },
        map: mapRef.current,
        title: store.name,
        icon: {
          path: window.google.maps.SymbolPath.CIRCLE,
          fillColor: t.pinColor,
          fillOpacity: 1,
          strokeColor: '#ffffff',
          strokeWeight: 2.5,
          scale: 9,
        },
      });
      const infoWindow = new window.google.maps.InfoWindow({
        content: `<div style="font-family:system-ui;padding:4px 2px"><div style="font-weight:700;font-size:12px;color:#1a1a1a">${store.name}</div><div style="font-size:11px;color:#666">${count} upcoming</div></div>`,
      });
      marker.addListener('click', () => {
        markersRef.current.forEach(m => m.infoWindow.close());
        infoWindow.open(mapRef.current, marker);
        onSelectStore(store);
      });
      return { marker, store, infoWindow };
    });
  }, [sdkReady]); // eslint-disable-line react-hooks/exhaustive-deps

  // Re-style map when theme changes
  useEffect(() => {
    if (!mapRef.current) return;
    const styles = MAP_JS_STYLES[themeKey] || MAP_JS_STYLES.sage;
    mapRef.current.setOptions({ styles });
    // Update marker fill colors
    markersRef.current.forEach(({ marker }) => {
      marker.setIcon({ ...marker.getIcon(), fillColor: t.pinColor });
    });
  }, [themeKey, t.pinColor]);

  // Pan to selected store, highlight its marker
  useEffect(() => {
    if (!mapRef.current || !selectedStore) return;
    mapRef.current.panTo({ lat: selectedStore.lat, lng: selectedStore.lng });
    markersRef.current.forEach(({ marker, store, infoWindow }) => {
      const sel = store.id === selectedStore.id;
      marker.setIcon({
        path: window.google.maps.SymbolPath.CIRCLE,
        fillColor: sel ? t.accent : t.pinColor,
        fillOpacity: 1,
        strokeColor: '#ffffff',
        strokeWeight: sel ? 3 : 2.5,
        scale: sel ? 13 : 9,
      });
      if (sel) infoWindow.open(mapRef.current, marker);
    });
  }, [selectedStore]); // eslint-disable-line react-hooks/exhaustive-deps

  // Update event counts in info windows when events change
  useEffect(() => {
    markersRef.current.forEach(({ store, infoWindow }) => {
      const count = events.filter(e => e.storeId === store.id).length;
      infoWindow.setContent(`<div style="font-family:system-ui;padding:4px 2px"><div style="font-weight:700;font-size:12px;color:#1a1a1a">${store.name}</div><div style="font-size:11px;color:#666">${count} upcoming</div></div>`);
    });
  }, [events]);

  if (sdkError) return (
    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,background:t.bg}}>
      <span style={{fontSize:13,color:t.textSub}}>Map unavailable</span>
    </div>
  );

  return (
    <div style={{position:'absolute',inset:0,overflow:'hidden'}}>
      {!sdkReady&&<div style={{position:'absolute',inset:0,background:t.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,zIndex:2}}>
        <svg width="28" height="28" viewBox="0 0 24 24" fill={t.accent} style={{animation:'spin 1.2s linear infinite'}}><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
        <span style={{fontSize:12,color:t.textSub}}>Loading map…</span>
      </div>}
      <div ref={containerRef} style={{position:'absolute',inset:0}}/>
    </div>
  );
}

function StoreDetailSheet({ store, events, t, onClose, onEventClick }) {
  const storeEvents = events.filter(e => e.storeId === store.id);

  const todayPlacesIdx = (new Date().getDay() + 6) % 7;

          </div>
          <div style={{width:36,height:36,borderRadius:18,background:t.accentLight,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill={t.accent}><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </div>
        </div>
      </div>

      {/* Filters */}
      {(screen==='events'||screen==='stores')&&(
        <div style={{borderBottom:`1px solid ${t.border}`}}>
          <div className="filter-row" style={{paddingTop:10,paddingBottom:6}}>
            {NEIGHBORHOODS.map(n=>(
              <div key={n} className="chip"
                style={{background:hood===n?t.chipActive:t.chipInactive,color:hood===n?t.chipActiveTxt:t.chipInactiveTxt,borderColor:hood===n?t.chipActive:t.border}}
                onClick={()=>setHood(n)}>{n}</div>
            ))}
          </div>
          {screen==='events'&&(
            <div className="filter-row" style={{paddingBottom:10}}>
              {EVENT_TYPES.map(type=>{
                const color=EVENT_TYPE_COLORS[type],on=evType===type;
                return <div key={type} className="chip"
                  style={{background:on?(color||t.chipActive):t.chipInactive,color:on?'white':(color||t.chipInactiveTxt),borderColor:on?(color||t.chipActive):(color?color+'40':t.border),fontSize:11}}
                  onClick={()=>setEvType(type)}>{type}</div>;
              })}
            </div>
          )}
        </div>
      )}

      {/* Content */}
      <div style={{flex:1,overflow:'hidden',position:'relative'}}>
        {hasMap&&(
          <div style={{position:'absolute',inset:0,display:screen==='map'?'block':'none',zIndex:screen==='map'?1:0}}>
            <MapView t={t} themeKey={themeKey} events={events} onSelectStore={s=>{setSelStore(s);setStoreSheet(s);}} selectedStore={selStore} active={screen==='map'}/>
          </div>
        )}

        {screen==='events'&&(
          <div className="app-scroll" style={{height:'100%',paddingTop:10,paddingBottom:10}}>
            {eventsLoading?(
              <div style={{display:'flex',justifyContent:'center',paddingTop:60}}><Spinner t={t}/></div>
            ):featured?(
              <>
                <div style={{margin:'0 16px 16px',borderRadius:16,overflow:'hidden',background:t.accent,cursor:'pointer',boxShadow:t.cardShadow}} onClick={()=>setSelEvent(featured)}>
                  <div style={{padding:'20px 18px',background:'linear-gradient(135deg,rgba(0,0,0,0.1) 0%,rgba(0,0,0,0) 100%)'}}>
                    <div style={{fontSize:10,fontWeight:700,color:'rgba(255,255,255,0.75)',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:8}}>✦ Featured Tonight</div>
                    <div style={{fontFamily:"'Playfair Display',serif",fontSize:19,fontWeight:700,color:'white',lineHeight:1.25,marginBottom:10}}>{featured.title}</div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <span style={{fontSize:12,color:'rgba(255,255,255,0.85)',fontWeight:500}}>{featured.date} · {featured.time}</span>
                      <span style={{width:3,height:3,borderRadius:'50%',background:'rgba(255,255,255,0.5)'}}/>
                      <span style={{fontSize:12,color:'rgba(255,255,255,0.85)',fontWeight:500}}>{BOOKSTORES.find(s=>s.id===featured.storeId)?.name}</span>
                    </div>
                  </div>
                </div>
                <div style={{margin:'0 16px 12px',fontSize:11,fontWeight:700,color:t.textSub,letterSpacing:'0.1em',textTransform:'uppercase'}}>All Events</div>
                {filtered.slice(1).map(ev=>{
                  const store=BOOKSTORES.find(s=>s.id===ev.storeId);
                  return <EventCard key={ev.id} event={ev} store={store} t={t} onClick={()=>setSelEvent(ev)} saved={saved.has(ev.id)}/>;
                })}
              </>
            ):(
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'60%',gap:12}}>
                <div style={{fontSize:15,color:t.text,fontFamily:"'Playfair Display',serif",fontStyle:'italic'}}>No upcoming events</div>
                <div style={{fontSize:13,color:t.textSub}}>Check back soon — new events added weekly.</div>
              </div>
            )}
          </div>
        )}

        {screen==='stores'&&(
          <div className="app-scroll" style={{height:'100%',paddingTop:10,paddingBottom:10}}>
            {BOOKSTORES.filter(s=>hood==='All'||s.borough===hood||s.neighborhood===hood).map(store=>{
              const count=events.filter(e=>e.storeId===store.id).length;
              return (
                <div key={store.id} style={{margin:'0 16px 10px',padding:'14px 16px',background:t.surface,borderRadius:14,boxShadow:t.cardShadow,cursor:'pointer'}} onClick={()=>setStoreSheet(store)}>
                  <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,fontWeight:600,color:t.text,marginBottom:2}}>{store.name}</div>
                      <div style={{fontSize:11,color:t.textSub,marginBottom:2}}>{store.neighborhood} · {store.borough}</div>
                      <div style={{fontSize:11,color:t.textSub,fontStyle:'italic',fontFamily:"'Playfair Display',serif"}}>{store.tagline}</div>
                    </div>
                    {count>0&&<div style={{background:t.accentLight,borderRadius:10,padding:'4px 8px',marginLeft:10}}><span style={{fontSize:11,fontWeight:700,color:t.accent}}>{count} events</span></div>}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {screen==='saved'&&(
          <div className="app-scroll" style={{height:'100%',paddingTop:10,paddingBottom:10}}>
            {savedLoading?(
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'60%',gap:12}}>
                <Spinner t={t}/>
                <div style={{fontSize:13,color:t.textSub}}>Loading your saved events…</div>
              </div>
            ):saved.size===0?(
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'60%',gap:12}}>
                <svg width="40" height="40" viewBox="0 0 24 24" fill={t.border}><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                <div style={{fontSize:15,color:t.text,fontFamily:"'Playfair Display',serif",fontStyle:'italic'}}>No saved events yet</div>
                <div style={{fontSize:13,color:t.textSub,textAlign:'center',maxWidth:220,lineHeight:1.5}}>Tap Save on any event and it'll appear here — even after you close the app.</div>
              </div>
            ):events.filter(e=>saved.has(e.id)).map(ev=>{
              const store=BOOKSTORES.find(s=>s.id===ev.storeId);
              return <EventCard key={ev.id} event={ev} store={store} t={t} onClick={()=>setSelEvent(ev)} saved={true}/>;
            })}
          </div>
        )}
      </div>

      {/* Bottom nav */}
      <div style={{background:t.nav,borderTop:'1px solid rgba(255,255,255,0.08)',paddingBottom:`calc(20px + ${isMobile?'env(safe-area-inset-bottom, 0px)':'0px'})`,display:'flex'}}>
        {nav.map(item=>{
          const on=screen===item.id;
          return (
            <div key={item.id} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',padding:'10px 0 2px',cursor:'pointer',opacity:on?1:0.45,transition:'opacity 0.15s'}}
              onClick={()=>{setScreen(item.id);if(item.id==='map')setHasMap(true);else setSelStore(null);}}>
              <div style={{position:'relative'}}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill={t.navText}><path d={item.icon}/></svg>
                {item.id==='saved'&&!savedLoading&&saved.size>0&&(
                  <div style={{position:'absolute',top:-4,right:-6,width:14,height:14,borderRadius:7,background:t.accent,display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <span style={{fontSize:8,fontWeight:700,color:'white'}}>{saved.size}</span>
                  </div>
                )}
              </div>
              <span style={{fontSize:9,color:t.navText,marginTop:3,fontWeight:on?600:400,letterSpacing:'0.02em'}}>{item.label}</span>
            </div>
          );
        })}
      </div>

      {selEvent&&<EventDetailSheet event={selEvent} store={BOOKSTORES.find(s=>s.id===selEvent.storeId)} t={t} onClose={()=>setSelEvent(null)} onToggleSave={toggleSave} saved={saved.has(selEvent.id)} saving={savingId===selEvent.id}/>}
      {storeSheet&&<StoreDetailSheet store={storeSheet} events={events} t={t} onClose={()=>setStoreSheet(null)} onEventClick={ev=>{setStoreSheet(null);setSelEvent(ev);}}/>}
    </div>
  );
}

// ── ROOT ──────────────────────────────────────────────────────────────────────
function Root() {
  const [theme,setTheme]=useState('sage');
  const [showThree,setShowThree]=useState(false);
  const [tweaksOpen,setTweaksOpen]=useState(false);
  const [events,setEvents]=useState([]);
  const [eventsLoading,setEventsLoading]=useState(true);
  const labels={parchment:'Parchment',noir:'Noir',sage:'Sage'};
  const isMobile = window.innerWidth <= 500;

  useEffect(()=>{
    loadEvents().then(evs=>{setEvents(evs);setEventsLoading(false);});
  },[]);

  // ── Real phone: full-screen, no frame, safe-area aware ──
  if (isMobile) {
    return (
      <div className="mobile-shell" style={{background:THEMES[theme].bg}}>
        <BookstoreApp t={THEMES[theme]} themeKey={theme} events={events} eventsLoading={eventsLoading} isMobile={true}/>
      </div>
    );
  }

  const themes=showThree?['parchment','noir','sage']:[theme];

  return (
    <>
      <div className="scene">
        {themes.map(key=>(
          <div key={key} style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
            <IOSDevice dark={key==='noir'}>
              <BookstoreApp t={THEMES[key]} themeKey={key} events={events} eventsLoading={eventsLoading}/>
            </IOSDevice>
            {showThree&&<div style={{fontFamily:'DM Sans',fontSize:11,fontWeight:500,letterSpacing:'0.12em',textTransform:'uppercase',color:'rgba(255,255,255,0.35)',textAlign:'center',marginTop:12}}>{labels[key]}</div>}
          </div>
        ))}
      </div>

      <button onClick={()=>setTweaksOpen(o=>!o)}
        style={{position:'fixed',bottom:20,right:tweaksOpen?232:20,width:40,height:40,borderRadius:20,background:'#D4A843',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 16px rgba(0,0,0,0.4)',zIndex:1001,transition:'right 0.2s'}}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1C1410"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
      </button>

      {tweaksOpen&&(
        <div className="tweaks-panel" style={{background:'#1C1410',color:'#F2E8D5'}}>
          <h4 style={{color:'#F2E8D5'}}>Tweaks</h4>
          <div className="tweak-label" style={{color:'#A08060'}}>Display</div>
          {[{k:true,l:'All 3 Themes'},{k:false,l:'Single Theme'}].map(o=>(
            <button key={String(o.k)} className="tweak-btn"
              style={{background:showThree===o.k?'#D4A843':'rgba(255,255,255,0.07)',color:showThree===o.k?'#1C1410':'#F2E8D5'}}
              onClick={()=>setShowThree(o.k)}>{o.l}</button>
          ))}
          {!showThree&&<>
            <div className="tweak-divider"/>
            <div className="tweak-label" style={{color:'#A08060'}}>Theme</div>
            {Object.entries(labels).map(([k,l])=>(
              <button key={k} className="tweak-btn"
                style={{background:theme===k?'#D4A843':'rgba(255,255,255,0.07)',color:theme===k?'#1C1410':'#F2E8D5'}}
                onClick={()=>setTheme(k)}>{l}</button>
            ))}
          </>}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
<div id="root"></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(r => console.log('SW registered', r.scope))
      .catch(e => console.log('SW error', e));
  });
}
</script>
</body>
</html>
