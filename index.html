<script>
// ── SUPABASE ────────────────────────────────────────────────────────────────
const _supabase = window.supabase.createClient(
  'https://txjngemvvpiqrrxhznzc.supabase.co',
  'sb_publishable_nweGjy0ATaDdZDAWeD5hWg_IGJZH7VR'
);

function getUserId() {
  let id = localStorage.getItem('nyc_bookstore_user_id');
  if (!id) {
    id = ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    localStorage.setItem('nyc_bookstore_user_id', id);
  }
  return id;
}

async function fetchSaved() {
  const { data, error } = await _supabase
    .from('bookmarked_events')
    .select('event_id')
    .eq('user_id', getUserId());
  if (error) { console.error('fetchSaved:', error); return new Set(); }
  return new Set(data.map(r => r.event_id));
}

async function saveEvent(eventId) {
  const { error } = await _supabase
    .from('bookmarked_events')
    .upsert({ user_id: getUserId(), event_id: eventId }, { onConflict: 'user_id,event_id' });
  if (error) console.error('saveEvent:', error);
}

async function unsaveEvent(eventId) {
  const { error } = await _supabase
    .from('bookmarked_events')
    .delete()
    .eq('user_id', getUserId())
    .eq('event_id', eventId);
  if (error) console.error('unsaveEvent:', error);
}
</script>

function latLngToPixel(lat, lng, cLat, cLng, zoom, W, H) {
  const scale = 256 * Math.pow(2, zoom);
  const mercY = (d) => { const s = Math.min(Math.max(Math.sin(d*Math.PI/180),-0.9999),0.9999); return scale*(0.5-Math.log((1+s)/(1-s))/(4*Math.PI)); };
  const mercX = (d) => scale*(d+180)/360;
  return { x:(mercX(lng)-mercX(cLng))+W/2, y:(mercY(lat)-mercY(cLat))+H/2 };
}

function MapView({ t, themeKey, onSelectStore, selectedStore, active }) {
  const ref = useRef(null);
  const [size, setSize] = useState({ w:390, h:500 });
  const [center, setCenter] = useState({ lat:40.730, lng:-74.010 });
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    if (!active || !ref.current) return;
    const r = ref.current.getBoundingClientRect();
    if (r.width > 0) setSize({ w:Math.round(r.width), h:Math.round(r.height) });
  }, [active]);

  useEffect(() => {
    if (selectedStore) setCenter({ lat:selectedStore.lat, lng:selectedStore.lng });
  }, [selectedStore]);

  const zoom = 12;
  const styles = (STATIC_STYLES[themeKey]||STATIC_STYLES.sage).map(s=>`&${s}`).join('');
  const mapUrl = `https://maps.googleapis.com/maps/api/staticmap?center=${center.lat},${center.lng}&zoom=${zoom}&size=${size.w}x${size.h}&scale=2${styles}&key=${GOOGLE_MAPS_API_KEY}`;

  return (
    <div ref={ref} style={{ position:'absolute', inset:0, overflow:'hidden' }}>
      {!loaded && (
        <div style={{ position:'absolute', inset:0, background:t.bg, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10, zIndex:2 }}>
          <svg width="28" height="28" viewBox="0 0 24 24" fill={t.accent} style={{ animation:'spin 1.2s linear infinite' }}><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
          <span style={{ fontSize:12, color:t.textSub }}>Loading map…</span>
        </div>
      )}
      <img src={mapUrl} alt="map" onLoad={()=>setLoaded(true)} onError={()=>setLoaded(true)} key={mapUrl}
        style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', display:loaded?'block':'none' }} />
      {loaded && BOOKSTORES.map(store => {
        const pos = latLngToPixel(store.lat, store.lng, center.lat, center.lng, zoom, size.w, size.h);
        const sel = selectedStore?.id === store.id;
        if (pos.x<-20||pos.x>size.w+20||pos.y<-20||pos.y>size.h+20) return null;
        return (
          <div key={store.id} onClick={()=>onSelectStore(store)}
            style={{ position:'absolute', left:pos.x, top:pos.y, transform:'translate(-50%,-100%)', cursor:'pointer', zIndex:sel?10:5, transition:'all 0.2s' }}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
              <div style={{ width:sel?34:26, height:sel?34:26, borderRadius:'50%', background:sel?t.accent:t.pinColor, border:'2.5px solid white', boxShadow:sel?'0 3px 14px rgba(0,0,0,0.4)':'0 2px 8px rgba(0,0,0,0.3)', display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.2s' }}>
                <svg width={sel?14:11} height={sel?14:11} viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
              </div>
              <div style={{ width:2, height:sel?9:7, background:sel?t.accent:t.pinColor, opacity:0.85 }} />
            </div>
            {sel && (
              <div style={{ position:'absolute', bottom:'100%', left:'50%', transform:'translateX(-50%)', background:'white', borderRadius:8, padding:'6px 10px', boxShadow:'0 4px 16px rgba(0,0,0,0.2)', whiteSpace:'nowrap', marginBottom:4, pointerEvents:'none' }}>
                <div style={{ fontSize:10, fontWeight:700, color:'#1a1a1a' }}>{store.name}</div>
                <div style={{ fontSize:9, color:'#666' }}>{EVENTS.filter(e=>e.storeId===store.id).length} events</div>
                <div style={{ position:'absolute', bottom:-5, left:'50%', transform:'translateX(-50%)', width:0, height:0, borderLeft:'5px solid transparent', borderRight:'5px solid transparent', borderTop:'5px solid white' }} />
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

            <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill={t.accent}><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
              <span style={{ fontSize:13, fontWeight:700, color:t.text }}>{store?.name}</span>
            </div>
            <div style={{ fontSize:12, color:t.textSub }}>{store?.address} · {store?.neighborhood}</div>
          </div>
          <div style={{ fontSize:14, color:t.text, lineHeight:1.65, marginBottom:20, opacity:0.85 }}>{event.desc}</div>
          <div style={{ display:'flex', gap:10, marginBottom:10 }}>
            <button onClick={()=>onToggleSave(event.id)} disabled={saving}
              style={{ flex:1, padding:'13px', background:saved?t.accentLight:t.accent, color:saved?t.accent:'white', border:saved?`1.5px solid ${t.accent}`:'none', borderRadius:12, fontSize:14, fontWeight:600, cursor:saving?'wait':'pointer', fontFamily:'DM Sans', transition:'all 0.2s', opacity:saving?0.7:1 }}>
              {saving ? '…' : saved ? '✓ Saved' : 'Save Event'}
            </button>
            <button style={{ padding:'13px 16px', background:t.accentLight, color:t.accent, border:'none', borderRadius:12, fontSize:14, fontWeight:600, cursor:'pointer', fontFamily:'DM Sans' }}>Share</button>
          </div>
          {event.url && (
            <a href={event.url} target="_blank" rel="noopener noreferrer"
              style={{ display:'block', textAlign:'center', padding:'12px', background:t.surfaceAlt, color:t.textSub, borderRadius:12, fontSize:13, fontWeight:500, textDecoration:'none', border:`1px solid ${t.border}` }}>
              View Event Page ↗
            </a>
          )}
        </div>
      </div>
    </div>
  );
}

// ── STORE DETAIL SHEET ────────────────────────────────────────────────────────

function StoreDetailSheet({ store, t, onClose, onEventClick }) {
  const storeEvents = EVENTS.filter(e=>e.storeId===store.id);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="bottom-sheet" style={{ background:t.sheetBg, maxHeight:'70%' }} onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle" style={{ background:t.text }} />
        <div style={{ padding:'0 20px 8px' }}>
          <div style={{ fontFamily:"'Playfair Display',serif", fontSize:20, fontWeight:700, color:t.text, marginBottom:4 }}>{store.name}</div>
          <div style={{ fontSize:12, color:t.textSub, marginBottom:2 }}>{store.address} · {store.neighborhood}</div>
          <div style={{ fontSize:12, color:t.textSub, fontStyle:'italic', marginBottom:14, fontFamily:"'Playfair Display',serif" }}>{store.tagline}</div>
          <div style={{ fontSize:12, fontWeight:600, color:t.accent, marginBottom:10, textTransform:'uppercase', letterSpacing:'0.08em' }}>
            {storeEvents.length} Upcoming {storeEvents.length===1?'Event':'Events'}
          </div>
        </div>
        {storeEvents.length===0
          ? <div style={{ padding:'20px', textAlign:'center', color:t.textSub, fontSize:13 }}>No upcoming events</div>
          : storeEvents.map(ev=>(
            <div key={ev.id} onClick={()=>onEventClick(ev)} style={{ margin:'0 16px 10px', padding:'12px 14px', background:t.surfaceAlt, borderRadius:10, cursor:'pointer' }}>
              <div style={{ fontSize:13, fontWeight:600, color:t.text, fontFamily:"'Playfair Display',serif", marginBottom:4 }}>{ev.title}</div>
              <div style={{ fontSize:11, color:t.textSub }}>{ev.date} · {ev.time} · {ev.price}</div>
            </div>
          ))
        }
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────

function BookstoreApp({ t, themeKey }) {
  const [screen, setScreen] = useState('events');
  const [hood, setHood] = useState('All');
  const [eventType, setEventType] = useState('All');
  const [selectedEvent, setSelectedEvent] = useState(null);
  const [selectedStore, setSelectedStore] = useState(null);
  const [storeSheet, setStoreSheet] = useState(null);
  const [hasVisitedMap, setHasVisitedMap] = useState(false);

  // Saved — Supabase backed
  const [savedEvents, setSavedEvents] = useState(new Set());
  const [savedLoading, setSavedLoading] = useState(true);
  const [savingId, setSavingId] = useState(null);

  useEffect(() => {
    fetchSaved().then(set => { setSavedEvents(set); setSavedLoading(false); });
  }, []);

  const toggleSave = async (eventId) => {
    const wasSaved = savedEvents.has(eventId);
    setSavingId(eventId);
    // Optimistic update
    setSavedEvents(prev => { const n=new Set(prev); wasSaved?n.delete(eventId):n.add(eventId); return n; });
    if (wasSaved) await unsaveEvent(eventId); else await saveEvent(eventId);
    setSavingId(null);
  };

  const filtered = EVENTS.filter(ev => {
    const store = BOOKSTORES.find(s=>s.id===ev.storeId);
    const hoodOk = hood==='All'||(store&&(store.borough===hood||store.neighborhood===hood));
    const typeOk = eventType==='All'||ev.type===eventType;
    return hoodOk && typeOk;
  });

  const navItems = [
    { id:'events', label:'Events', icon:"M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z" },
    { id:'map',    label:'Map',    icon:"M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z" },
    { id:'stores', label:'Stores', icon:"M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z" },
    { id:'saved',  label:'Saved',  icon:"M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z" },
  ];

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', background:t.bg, position:'relative', overflow:'hidden' }}>

      {/* Header */}
      <div style={{ padding:'14px 20px 10px', background:t.bg, borderBottom:`1px solid ${t.border}` }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div>
            <div style={{ fontFamily:"'Playfair Display',serif", fontSize:22, fontWeight:700, color:t.text, lineHeight:1 }}>
              {screen==='events'?'Events':screen==='map'?'Explore':screen==='stores'?'Bookstores':'Saved'}
            </div>
            <div style={{ fontSize:11, color:t.textSub, marginTop:2, fontWeight:500 }}>
              {screen==='events'?`${filtered.length} upcoming`
               :screen==='map'?'NYC · Hoboken · Jersey City'
               :screen==='stores'?`${BOOKSTORES.length} venues`
               :savedLoading?'Loading…':`${savedEvents.size} saved`}
            </div>
          </div>
          <div style={{ width:36, height:36, borderRadius:18, background:t.accentLight, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill={t.accent}><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </div>
        </div>
      </div>

      {/* Filters */}
      {(screen==='events'||screen==='stores') && (
        <div style={{ borderBottom:`1px solid ${t.border}` }}>
          <div className="filter-row" style={{ paddingTop:10, paddingBottom:6 }}>
            {NEIGHBORHOODS.map(n => (
              <div key={n} className="chip"
                style={{ background:hood===n?t.chipActive:t.chipInactive, color:hood===n?t.chipActiveTxt:t.chipInactiveTxt, borderColor:hood===n?t.chipActive:t.border }}
                onClick={()=>setHood(n)}>{n}</div>
            ))}
          </div>
          {screen==='events' && (
            <div className="filter-row" style={{ paddingBottom:10 }}>
              {EVENT_TYPES.map(type => {
                const color = EVENT_TYPE_COLORS[type];
                const on = eventType===type;
                return (
                  <div key={type} className="chip"
                    style={{ background:on?(color||t.chipActive):t.chipInactive, color:on?'white':(color||t.chipInactiveTxt), borderColor:on?(color||t.chipActive):(color?color+'40':t.border), fontSize:11 }}
                    onClick={()=>setEventType(type)}>{type}</div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* Content */}
      <div style={{ flex:1, overflow:'hidden', position:'relative' }}>

        {hasVisitedMap && (
          <div style={{ position:'absolute', inset:0, display:screen==='map'?'block':'none', zIndex:screen==='map'?1:0 }}>
            <MapView t={t} themeKey={themeKey} onSelectStore={s=>{setSelectedStore(s);setStoreSheet(s);}} selectedStore={selectedStore} active={screen==='map'} />
          </div>
        )}

        {screen==='events' && (
          <div className="app-scroll" style={{ height:'100%', paddingTop:10, paddingBottom:10 }}>
            <div style={{ margin:'0 16px 16px', borderRadius:16, overflow:'hidden', background:t.accent, cursor:'pointer', boxShadow:t.cardShadow }}
              onClick={()=>setSelectedEvent(EVENTS[0])}>
              <div style={{ padding:'20px 18px', background:'linear-gradient(135deg,rgba(0,0,0,0.1) 0%,rgba(0,0,0,0) 100%)' }}>
                <div style={{ fontSize:10, fontWeight:700, color:'rgba(255,255,255,0.75)', letterSpacing:'0.12em', textTransform:'uppercase', marginBottom:8 }}>✦ Featured Tonight</div>
                <div style={{ fontFamily:"'Playfair Display',serif", fontSize:19, fontWeight:700, color:'white', lineHeight:1.25, marginBottom:10 }}>{EVENTS[0].title}</div>
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  <span style={{ fontSize:12, color:'rgba(255,255,255,0.85)', fontWeight:500 }}>{EVENTS[0].date} · {EVENTS[0].time}</span>
                  <span style={{ width:3, height:3, borderRadius:'50%', background:'rgba(255,255,255,0.5)' }} />
                  <span style={{ fontSize:12, color:'rgba(255,255,255,0.85)', fontWeight:500 }}>Strand Bookstore</span>
                </div>
              </div>
            </div>
            <div style={{ margin:'0 16px 12px', fontSize:11, fontWeight:700, color:t.textSub, letterSpacing:'0.1em', textTransform:'uppercase' }}>All Events</div>
            {filtered.slice(1).map(ev=>{
              const store=BOOKSTORES.find(s=>s.id===ev.storeId);
              return <EventCard key={ev.id} event={ev} store={store} t={t} onClick={()=>setSelectedEvent(ev)} saved={savedEvents.has(ev.id)} />;
            })}
          </div>
        )}

        {screen==='stores' && (
          <div className="app-scroll" style={{ height:'100%', paddingTop:10, paddingBottom:10 }}>
            {BOOKSTORES.filter(s=>hood==='All'||s.borough===hood||s.neighborhood===hood).map(store=>{
              const count=EVENTS.filter(e=>e.storeId===store.id).length;
              return (
                <div key={store.id} style={{ margin:'0 16px 10px', padding:'14px 16px', background:t.surface, borderRadius:14, boxShadow:t.cardShadow, cursor:'pointer' }}
                  onClick={()=>setStoreSheet(store)}>
                  <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between' }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontFamily:"'Playfair Display',serif", fontSize:16, fontWeight:600, color:t.text, marginBottom:2 }}>{store.name}</div>
                      <div style={{ fontSize:11, color:t.textSub, marginBottom:2 }}>{store.neighborhood} · {store.borough}</div>
                      <div style={{ fontSize:11, color:t.textSub, fontStyle:'italic', fontFamily:"'Playfair Display',serif" }}>{store.tagline}</div>
                    </div>
                    {count>0 && <div style={{ background:t.accentLight, borderRadius:10, padding:'4px 8px', marginLeft:10 }}><span style={{ fontSize:11, fontWeight:700, color:t.accent }}>{count} events</span></div>}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {screen==='saved' && (
          <div className="app-scroll" style={{ height:'100%', paddingTop:10, paddingBottom:10 }}>
            {savedLoading ? (
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'60%', gap:12 }}>
                <svg width="28" height="28" viewBox="0 0 24 24" fill={t.accent} style={{ animation:'spin 1.2s linear infinite' }}><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                <div style={{ fontSize:13, color:t.textSub }}>Loading your saved events…</div>
              </div>
            ) : savedEvents.size===0 ? (
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'60%', gap:12 }}>
                <svg width="40" height="40" viewBox="0 0 24 24" fill={t.border}><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                <div style={{ fontSize:15, color:t.text, fontFamily:"'Playfair Display',serif", fontStyle:'italic' }}>No saved events yet</div>
                <div style={{ fontSize:13, color:t.textSub, textAlign:'center', maxWidth:220, lineHeight:1.5 }}>Tap Save on any event and it'll appear here — even after you close the app.</div>
              </div>
            ) : EVENTS.filter(e=>savedEvents.has(e.id)).map(ev=>{
              const store=BOOKSTORES.find(s=>s.id===ev.storeId);
              return <EventCard key={ev.id} event={ev} store={store} t={t} onClick={()=>setSelectedEvent(ev)} saved={true} />;
            })}
          </div>
        )}
      </div>

      {/* Bottom nav */}
      <div style={{ background:t.nav, borderTop:'1px solid rgba(255,255,255,0.08)', paddingBottom:20, display:'flex' }}>
        {navItems.map(item=>{
          const on=screen===item.id;
          return (
            <div key={item.id} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', padding:'10px 0 2px', cursor:'pointer', opacity:on?1:0.45, transition:'opacity 0.15s' }}
              onClick={()=>{ setScreen(item.id); if(item.id==='map') setHasVisitedMap(true); else setSelectedStore(null); }}>
              <div style={{ position:'relative' }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill={t.navText}><path d={item.icon}/></svg>
                {item.id==='saved' && !savedLoading && savedEvents.size>0 && (
                  <div style={{ position:'absolute', top:-4, right:-6, width:14, height:14, borderRadius:7, background:t.accent, display:'flex', alignItems:'center', justifyContent:'center' }}>
                    <span style={{ fontSize:8, fontWeight:700, color:'white' }}>{savedEvents.size}</span>
                  </div>
                )}
              </div>
              <span style={{ fontSize:9, color:t.navText, marginTop:3, fontWeight:on?600:400, letterSpacing:'0.02em' }}>{item.label}</span>
            </div>
          );
        })}
      </div>

      {selectedEvent && (
        <EventDetailSheet
          event={selectedEvent}
          store={BOOKSTORES.find(s=>s.id===selectedEvent.storeId)}
          t={t} onClose={()=>setSelectedEvent(null)}
          onToggleSave={toggleSave}
          saved={savedEvents.has(selectedEvent.id)}
          saving={savingId===selectedEvent.id}
        />
      )}
      {storeSheet && (
        <StoreDetailSheet store={storeSheet} t={t} onClose={()=>setStoreSheet(null)}
          onEventClick={ev=>{ setStoreSheet(null); setSelectedEvent(ev); }} />
      )}
    </div>
  );
}

// ── ROOT ──────────────────────────────────────────────────────────────────────

function Root() {
  const [theme, setTheme] = useState('sage');
  const [showThree, setShowThree] = useState(false);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const themes = showThree ? ['parchment','noir','sage'] : [theme];
  const labels = { parchment:'Parchment', noir:'Noir', sage:'Sage' };

  return (
    <>
      <div className="scene">
        {themes.map(key => (
          <div key={key} style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
            <IOSDevice dark={key==='noir'}>
              <BookstoreApp t={THEMES[key]} themeKey={key} />
            </IOSDevice>
            {showThree && <div style={{ fontFamily:'DM Sans', fontSize:11, fontWeight:500, letterSpacing:'0.12em', textTransform:'uppercase', color:'rgba(255,255,255,0.35)', textAlign:'center', marginTop:12 }}>{labels[key]}</div>}
          </div>
        ))}
      </div>

      <button onClick={()=>setTweaksOpen(o=>!o)}
        style={{ position:'fixed', bottom:20, right:tweaksOpen?232:20, width:40, height:40, borderRadius:20, background:'#D4A843', border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 16px rgba(0,0,0,0.4)', zIndex:1001, transition:'right 0.2s' }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1C1410"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
      </button>

      {tweaksOpen && (
        <div className="tweaks-panel" style={{ background:'#1C1410', color:'#F2E8D5' }}>
          <h4 style={{ color:'#F2E8D5' }}>Tweaks</h4>
          <div className="tweak-label" style={{ color:'#A08060' }}>Display</div>
          {[{k:true,l:'All 3 Themes'},{k:false,l:'Single Theme'}].map(o=>(
            <button key={String(o.k)} className="tweak-btn"
              style={{ background:showThree===o.k?'#D4A843':'rgba(255,255,255,0.07)', color:showThree===o.k?'#1C1410':'#F2E8D5' }}
              onClick={()=>setShowThree(o.k)}>{o.l}</button>
          ))}
          {!showThree && <>
            <div className="tweak-divider" />
            <div className="tweak-label" style={{ color:'#A08060' }}>Theme</div>
            {Object.entries(labels).map(([k,l])=>(
              <button key={k} className="tweak-btn"
                style={{ background:theme===k?'#D4A843':'rgba(255,255,255,0.07)', color:theme===k?'#1C1410':'#F2E8D5' }}
                onClick={()=>setTheme(k)}>{l}</button>
            ))}
          </>}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>

<div id="root"></div>
</body>
</html>
